<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
.logo {
    display : flex;
    align-items: center;
    margin-bottom : 15px;
}
    
.logo h2{
    opacity: 0; /* 투명도 0 */
    white-space: nowrap; /* 줄바꿈이 되지 않도록 */
    transition: opacity 0.2s ease;
    background-color: transparent;
}

/* 사이드바 로고 크기 및 위치 */
.logo img{
    width: 45px;
    height: 45px; 
    display: flex;
    justify-content: center;
    align-items: center; 
    margin: 0 15px 0 15px;
}


.sidebar:hover .logo h2{
    opacity: 1;
}

.sidebar {
    width : 70px;
    height : 100%;

    transition : width 0.3s ease;

    border-right : 2px solid #eeeeee;

    /* 화면 상단에 고정 */
    position: fixed;
    top: 0;
    left: 0;

    /* 다른 요소보다 위에 표시 */
    z-index: 1000;
    

}

.sidebar:hover{
    width : 200px;
}


.sidebar_menu{
    display : flex;
    flex-direction : column;
    gap :10px;

}

.menu_item {
    
    display :flex;
    align-items : center;
   flex-direction: row; 

    padding : 0 2px; 
    overflow: hidden; 
    background-color: transparent;
    border: none;

    
    height: 50px;
    box-sizing: border-box;
    object-fit: contain;
    margin: 0 8px 0 12px;
}

.menu_item img{
    width: 30px;
    height: 30px; 
    object-fit: contain;
    display:block;
    margin: 0 8px 0 8px;
   flex-shrink: 0;

}



.menu_btn{
    opacity: 0; /* 투명도 0 */
    overflow:hidden;
    white-space: nowrap; /* 줄바꿈이 되지 않도록 */
    

    border :none;
    padding: 10px;
    background-color: transparent;
    text-align: left;
    transition: opacity 0.3s ease;
}


.menu_item:hover{
    background-color: #e1e4ec;
    border-radius: 8px;
}


/* 사이드바가 열렸을 때 글자 표시 */
.sidebar:hover .menu_btn{
    opacity:1;
}

.main {
    margin-left: 70px;
    transition: margin-left 0.3s ease;
}

.sidebar:hover ~ .main {
    margin-left: 200px;
}


.content {
    display: block;
}
.timeline{
    margin-left: 900px;
}
.timeline_item {
    display: flex;
    align-items: center;
    margin-bottom: 5px;
    
}

.timeline_time {
    width: 70px;
    flex-shrink: 0; /* 해당 요소의 크기가 줄어들지 않게 하는 속성 */
    font-size: 15px;
    white-space: nowrap;
}

.timeline_content {
    margin-left: 10px;
    font-size : 15px;
    white-space: nowrap;
}

.timeline_content h2 {
    margin: 0;
}

.timeline_page {
    display: none;
}

.timeline_layout {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    gap: 40px;
}

#video {
    width: 1100px;
     aspect-ratio: 16 / 9;
    height: auto;
}







</style>
</head>
<body>
<div class="sidebar">
 
    <!--로고-->
        <div class ="logo">
            <img src ="circle.png">
            <h2>강의 정리 AI</h2>
        </div>

 <!--사이드바 메뉴-->
 <div class="sidebar_menu">

 <!--홈 버튼-->
 <div class="menu_item" 
     onclick="location.href='../upload start.html/1.html'">
     <img src="home.png">
    <button class="menu_btn">
        <span>홈</span>
    </button>
 </div>

 <!--타임라인 버튼-->
 <div class="menu_item" id="timeline_button">
    <img src="timeline.png">
    <button class="menu_btn">
        <span>타임라인</span>
    </button>
 </div>

 <!--핵심요약 버튼-->
 <div class="menu_item">
     <img src="summary.png">
    <button class="menu_btn">
        <span>핵심 요약</span>
    </button>
 </div>

 <!--퀴즈 버튼-->
 <div class="menu_item">
    <img src="quiz.png">
    <button class="menu_btn">
        <span>퀴즈</span>
    </button>
 </div>

 <!--오답노트 버튼-->
 <div class="menu_item">
     <img src="wrong.png">
    <button class="menu_btn">
        <span>오답노트</span>
    </button>
 </div>
</div>
</div>

<div class="main">
  
 <div class="content">
    <h1>메인 화면</h1>
    <p>여기에 페이지 내용이 들어갑니다.</p>
 </div>

 <!--타임라인 화면-->
<div class="timeline_page">

    <div class="timeline_layout">

        <div class="video_container">
            <video id="video" controls>
                <source id="video_mp4" src="" type="video/mp4">
            </video>
        </div>

        <div class="timeline"></div>

    </div>

</div>

</div>

<script>
    /* 임시 데이터 */
    const timelineData = [
    {
        time: 0,
        title: "강의 소개",
       
    },
    {
        time: 162,
        title: "명사",
    },
    {
        time: 285,
        title: "가산명사",
    },
       
    {
        time: 370,
        title: "불가산 명사",
       
    }
];
/* 전달받은 초단위 시간을 분:초 형태로 변환 */
function formatTime(seconds) {
    const minutes = Math.floor(seconds / 60);
    const seconds_left = seconds % 60;

    return `${String(minutes).padStart(2, "0")}:${String(seconds_left).padStart(2, "0")}`;
}

/* 타임라인이 들어갈 html 요소 */
const timeline = document.querySelector(".timeline");

/* 임시데이터를 하나씩 꺼내서 화면에 출력  */
timelineData.forEach(item =>{
    const timeline_items = document.createElement("div");
    timeline_items.classList.add("timeline_item"); /*<div class ="timeline_item"></div> */
    
    /* 임시데이터의 시간과 타이틀을 화면에 보여줌 */
    timeline_items.innerHTML = `
        <div class="timeline_time">
            ${formatTime(item.time)}
        </div>

        <div class="timeline_content">
            <h4>${item.title}</h4>
        </div>
    `;
    /* 부모노드<div>에 timeline_items를 추가함 */
    timeline.appendChild(timeline_items);

});

/* 타임라인을 클릭했을 때 타임라인 화면이 보이게 */

const timeline_button = document.querySelector("#timeline_button");
const timeline_page = document.querySelector(".timeline_page");
const content = document.querySelector(".content");

timeline_button.addEventListener("click", () => {

    content.style.display = "none";
    timeline_page.style.display = "block";

});


</script>
</body>
</html>


</body>
</html>
