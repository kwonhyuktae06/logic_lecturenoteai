<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
.logo {
    display : flex;
    align-items: center;
    margin-bottom : 15px;
}
    
.logo h2{
    opacity: 0; /* 투명도 0 */
    white-space: nowrap; /* 줄바꿈이 되지 않도록 */
    transition: opacity 0.2s ease;
    background-color: transparent;
}

/* 사이드바 로고 크기 및 위치 */
.logo img{
    width: 45px;
    height: 45px; 
    display: flex;
    justify-content: center;
    align-items: center; 
    margin: 0 15px 0 15px;
}


.sidebar:hover .logo h2{
    opacity: 1;
}

.sidebar {
    width : 70px;
    height : 100%;

    transition : width 0.3s ease;

    border-right : 2px solid #eeeeee;

    /* 화면 상단에 고정 */
    position: fixed;
    top: 0;
    left: 0;

    /* 다른 요소보다 위에 표시 */
    z-index: 1000;
    

}

.sidebar:hover{
    width : 200px;
}


.sidebar_menu{
    display : flex;
    flex-direction : column;
    gap :10px;

}

.menu_item {
    
    display :flex;
    align-items : center;
   flex-direction: row; 

    padding : 0 2px; 
    overflow: hidden; 
    background-color: transparent;
    border: none;

    
    height: 50px;
    box-sizing: border-box;
    object-fit: contain;
    margin: 0 8px 0 12px;
}

.menu_item img{
    width: 30px;
    height: 30px; 
    object-fit: contain;
    display:block;
    margin: 0 8px 0 8px;
   flex-shrink: 0;

}



.menu_btn{
    opacity: 0; /* 투명도 0 */
    overflow:hidden;
    white-space: nowrap; /* 줄바꿈이 되지 않도록 */
    

    border :none;
    padding: 10px;
    background-color: transparent;
    text-align: left;
    transition: opacity 0.3s ease;
}


.menu_item:hover{
    background-color: #e1e4ec;
    border-radius: 8px;
}


/* 사이드바가 열렸을 때 글자 표시 */
.sidebar:hover .menu_btn{
    opacity:1;
}
.content {
    margin-left : 70px;
}
.sidebar:hover ~ .content {
    margin-left: 200px;
}



</style>
</head>
<body>
<div class="sidebar">
 
    <!--로고-->
        <div class ="logo">
            <img src ="circle.png">
            <h2>강의 정리 AI</h2>
        </div>

<!--사이드바 메뉴-->
<div class="sidebar_menu">


<div class="menu_item" 
     onclick="location.href='../upload start.html/1.html'">
     <img src="home.png">
    <button class="menu_btn">
        <span>홈</span>
    </button>
</div>

<div class="menu_item">
    <img src="timeline.png">
    <button class="menu_btn">
        <span>타임라인</span>
    </button>
</div>

<div class="menu_item">
     <img src="summary.png">
    <button class="menu_btn">
        <span>핵심 요약</span>
    </button>
</div>

<div class="menu_item">
    <img src="quiz.png">
    <button class="menu_btn">
        <span>퀴즈</span>
    </button>
</div>

<div class="menu_item">
     <img src="wrong.png">
    <button class="menu_btn">
        <span>오답노트</span>
    </button>
</div>
</div>
</div>
  

<div class="content">
    <h1>메인 화면</h1>
    <p>여기에 페이지 내용이 들어갑니다.</p>
</div>


</body>
</html>
