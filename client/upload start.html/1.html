<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강의 정리 AI</title>

<style>
    body {
        /* 전체 배경색 지정 */
    background-color:#fefef8; 
    font-family : serif; 
}

/* 텍스트 위치 */
.title {
    text-align: center; /* 텍스트 가운데 정렬 */
    margin : 65px; /* 바깥 여백 */
} 

/* 파일 선택 영역 크기 및 테두리 디자인 */
.gradient_outer {
    width: 100%;
    max-width: 900px;
    height: 380px;

    padding: 2px; /* 안쪽 여백 */

    background: linear-gradient( #724e24); /* 배경 라인색을 그라데이션으로 */
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.15); /* 그림자 효과 */

    border-radius: 24px; /*모서리를 둥글게*/
    margin: 0 auto; /* 가로 가운데 정렬 */
}

/* 파일 선택 영억 전체 사이즈 및 디자인 */
.content_inner {  
    width: 100%; 
    height: 100%;

    background: white;
    border-radius: 22px; 
    display: flex; /*flex 컨테이너로 만듦*/
    flex-direction: column; /*내부 요소를 세로 방향으로 배치*/
    justify-content: center; /* 가로 방향 가운데 정렬*/
    align-items: center; /*세로 방향에서 가운데 정렬*/
}

/* 파일 선택 버튼 외곽 테두리 */
.button_outer {
    width : 150px;
    height: 50px;
    border: 1px solid   #d2d2d2;      
    border-radius: 10px;
    box-sizing: border-box; /* border와 padding을 포함하여 크기 계산 */
}

/* 파일 선택 버튼 디자인 */
.button_file {
    width : 100%; /*  가로 크기 꽉 채움 */
    height: 100%; /* 세로 크기 꽉 채움 */
    padding: 0;  /* 버튼 안쪽 여백 제거 */
    font-size: 14px; /* 버튼 글자 크기 */
    color: black; /* 글자를 검은색으로 설정 */
    border: none; /* 기본 버튼 테두리 제거 */
    border-radius: 10px; /* 모서리 둥글게 */
    font-family : serif; 
    
}

/* 파일 선택 버튼에 마우스를 올렸을 때 */
.button_file:hover {
    background-color: #e1e4ec;
    color: black;
    
}

/* 파일 선택 버튼 디자인 */
.line {
    display: flex;
    align-items: center; /*세로 방향에서 가운데 정렬*/
    margin: 35px; /* 바깔쪽 여백 */
    padding: 0 30px; /* 안쪽 여백 (상하 좌우)*/
}

/*----또는---- */
.line hr {
    flex:1; /* 남은 공간 차지 */
    margin : 35px; 
}

/* 링크 업로드 영역 */
.upload_link_outer{
    width: 100%;
    height: 180px;
    max-width: 900px;
    padding: 2px; 
    background: linear-gradient(#724e24);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.15);
    border-radius: 24px;
    margin: 0 auto; 
}

/* 링크 업로드 영역 내부 레이아웃 */
.upload_link_inner {
    width: 100%; 
    height: 100%;
    box-sizing: border-box; /* 크기가 커지는 것을 방지 */
    background: white;
    border-radius: 22px;

    display: flex;
    flex-direction: column; /* 내부 요소들을 세로로 배치 */
    padding: 20px; /* 내부 내용과 박스 사이의 여백 */
}

/* 업로드 시작 버튼 중앙으로. */
.button_box{
    display: flex;
    justify-content: center; /*가로 가운데 정렬 */
    align-items: center;/* 세로 가운데 정렬 */
}

/*업로드 버튼 사이즈 및 디자인 */
.upload_button {
    width : 200px;
    height: 60px;
    background-color: #aaaaaa; /* 버튼 배경색 */
    color: white; 
    font-size: 14px;
    border: none;   /* 테두리 제거 */
    border-radius: 10px;
    margin : 35px; /* 버튼 바깥 여백 */
    font-family : serif; 
}

/* 업로드 시작 버튼이 사용 가능한 상태일 때 */
.upload_button:hover:not(:disabled){
    background-color: #f6ebd1;
    color: black;
    cursor: pointer;
}


</style>


</head>

<body>
<div class="title">
    <h1>강의 정리 AI</h1>
    <p>강의 영상이나 파일을 업로드하면 AI가 자동으로 정리해드립니다</p>
</div>


<!--파일 업로드 화면-->
<div class="gradient_outer">
    <div class="content_inner">
        <img src ="upload.png" width = "90" height ="80">
        <h3>파일을 드래그하거나 클릭하여 업로드</h3>
        <p>mp4, mp3, pdf, pptx, txt 파일을 지원합니다</p>
        <div class ="button_outer">
            <button class ="button_file" id="select_button">
                파일 선택
            </button>
            <input type ="file" id="file_input" class ="button_file" accept=".mp3, .mp4, .pptx, .txt" hidden>
        </div>
    </div>
</div>  
    

<!--업로드가 가능한 파일 제한하기 -->
<input type="file" id="file_input" accept=".mp3, .mp4, .pptx, .txt .pdf">
    
<!--중앙 "또는" 라인-->
<div class="line">
    <hr>
    <span>또는</span>
    <hr>
</div>


<!--링크 업로드 화면-->
<div class ="upload_link_outer">
  <div class ="upload_link_inner">
     <h3>링크로 업로드</h3>
     <p>Youtube, Video 등의 강의 영상 링크를 입력하세요.</p>
     <input type ="text" id = "url_input" placeholder ="ex: https://youtube.com/watch?v=....">
    </div>
</div>


<!--업로드 시작 버튼 화면 -->
<div class =" button_box">
<button id="upload_start_button" class="upload_button">
    업로드 시작
</button>   
</div>
  
<script>
    /* 변수 설정 */
    const file_input =document.getElementById("file_input"); /* 파일 선택 */
    const url_input=document.getElementById("url_input"); /* 링크 입력 */
    const upload_start_button =document.getElementById("upload_start_button"); /* 업로드 버튼 */
    let selected_file = null; /* 선택된 파일 저장 */


/* 파일선택 */
   file_input.addEventListener("change", function(event) {
    selected_file = event.target.files[0]; /* 첫 번째 파일을 가져옴 */

    if (selected_file) {
        console.log("선택한 파일:", selected_file.name); /* 파일을 잘 선택했는지 확인 */

        upload_start_button.disabled = false /* 업로드 버튼 활성화 */
    }
});

/* 파일 선택 버튼 클릭 */
const select_button = document.getElementById("select_button");

select_button.addEventListener("click", () => {
    file_input.click();
});


/* 업로드 버튼 클릭 */
upload_start_button.addEventListener("click", async function (event) {

    event.preventDefault(); /* 폼 제출 시 페이지 새로고침을 막는 행동 */


/* 파일 선택 */
    if (selected_file) { /* 파일이 있으면 */

        const formData = new FormData(); /* multipart/form-data으로 보내야하므로  */

        formData.append("file", selected_file); /* 데이터 추가 */

        try {

            const response = await fetch( /* 서버에 요청을 보냄 */
                "http://localhost:8000/api/v1/upload/file",
                {
                    method: "POST",/* 보내기 */
                    body: formData /* 보낼 데이터 */
                }
            );

            const data = await response.json(); /* 서버가 보낸 응답을 자바스크립트 객체로 변환 */
            console.log(data); /* 콘솔에 데이터 출력 */

            alert("파일 업로드 성공");
            location.href = "upload start.html";

        } catch (error) {

            console.error(error); /* 콘솔에 오류 출력 */

            alert("업로드 실패");

        }

        return;
    }

    



/* 링크 업로드 */
 const url = url_input.value.trim(); /* .value : 사용자가 입력한 값을 가져옴 */

    if (url !== "") { /* url이 비어있지않으면 실행 */

        try {

            const response = await fetch( /* url 업로드 API에 데이터를 보냄 */
                "http://localhost:8000/api/v1/upload/url",
                {
                    method: "POST", /* 보내기 */

                    headers: {
                        "Content-Type": "application/json" /* 서버에게 json 형식의 데이터를 보냄 */
                    },

                    body: JSON.stringify({ /* 문자열로 변환 */
                        url: url
                    })

                }
            );

            const data = await response.json();

            console.log(data); /* 서버에서 보내준 응답 출력 */

            alert("링크 업로드 성공");
        
        /* 오류 발생 시 */

        } catch (error) { 

            console.error(error);

            alert("업로드 실패");

        }

        return;
    }

    alert("파일을 선택하거나 링크를 입력해주세요.");
});

</script>
</body>

</html>
