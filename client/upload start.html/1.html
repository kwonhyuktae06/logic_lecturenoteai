<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강의 정리 AI</title>


<link rel ="stylesheet" href ="1.css">
</head>

<body>
<div class="title">
    <h1>강의 정리 AI</h1>
    <p>강의 영상이나 파일을 업로드하면 AI가 자동으로 정리해드립니다</p>
</div>


<!--파일 업로드 화면-->
<div class="gradient_outer">
    <div class="content_inner">
        <img src ="upload.png" width = "90" height ="80">
        <h3>파일을 드래그하거나 클릭하여 업로드</h3>
        <p>mp4, mp3, pdf, pptx, txt 파일을 지원합니다</p>
       <input type="file" id="file_input" hidden accept=".mp3,.mp4,.pptx,.txt,.pdf">

      <div class="button_outer">
        <button type="button" class="button_file" id="select_button">
        파일 선택
        </button>
      </div>
      <p id="file_name">선택된 파일 없음</p>
    </div>
</div>  




<!--중앙 "또는" 라인-->
<div class="line">
    <hr>
    <span>또는</span>
    <hr>
</div>


<!--링크 업로드 화면-->
<div class ="upload_link_outer">
  <div class ="upload_link_inner">
     <h3>링크로 업로드</h3>
     <p>Youtube, Video 등의 강의 영상 링크를 입력하세요.</p>
     <input type ="text" id = "url_input" placeholder ="ex: https://youtube.com/watch?v=....">
  </div>
</div>


<!--업로드 시작 버튼 화면 -->
<div class =" button_box">
<button id="upload_start_button" class="upload_button">
    업로드 시작
</button>   
</div>


  
<script src = "1.js" ></script>
</body>

</html>
