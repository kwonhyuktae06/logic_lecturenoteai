<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>강의 정리 AI</title>

    <style>

        /* =========================
           사이드바
        ========================= */

        .logo {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .logo h2 {
            opacity: 0;
            white-space: nowrap;
            transition: opacity 0.2s ease;
            background-color: transparent;
        }

        .logo img {
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 15px;
        }

        .sidebar:hover .logo h2 {
            opacity: 1;
        }

        .sidebar {
            width: 70px;
            height: 100%;

            transition: width 0.3s ease;

            border-right: 2px solid #eeeeee;

            position: fixed;
            top: 0;
            left: 0;

            z-index: 1000;
        }

        .sidebar:hover {
            width: 200px;
        }

        .sidebar_menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .menu_item {
            display: flex;
            align-items: center;
            flex-direction: row;

            padding: 0 2px;
            overflow: hidden;

            background-color: transparent;
            border: none;

            height: 50px;
            box-sizing: border-box;

            margin: 0 8px 0 12px;

            cursor: pointer;
        }

        .menu_item img {
            width: 30px;
            height: 30px;

            object-fit: contain;
            display: block;

            margin: 0 8px;

            flex-shrink: 0;
        }

        .menu_btn {
            opacity: 0;
            overflow: hidden;
            white-space: nowrap;

            border: none;
            padding: 10px;

            background-color: transparent;
            text-align: left;

            transition: opacity 0.3s ease;

            cursor: pointer;
        }

        .menu_item:hover {
            background-color: #e1e4ec;
            border-radius: 8px;
        }

        .sidebar:hover .menu_btn {
            opacity: 1;
        }

        .main {
            margin-left: 70px;
            transition: margin-left 0.3s ease;
        }

        .sidebar:hover ~ .main {
            margin-left: 200px;
        }


        /* =========================
           기본 화면
        ========================= */

        .content {
            display: block;
            padding: 30px;
        }


        /* =========================
           타임라인 화면
        ========================= */

        .timeline_page {
            display: none;
            padding: 30px;
        }

        .timeline_layout {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 40px;
        }


        /* 영상 */

        .video_container {
            width: 70%;
        }

        #video {
            width: 100%;
            aspect-ratio: 16 / 9;
            height: auto;
            background-color: black;
        }


        /* 타임라인 */

        .timeline {
            width: 300px;
        }

        .timeline_item {
            display: flex;
            align-items: center;

            margin-bottom: 5px;
            padding: 8px;

            border-radius: 5px;

            cursor: pointer;

            transition: background-color 0.15s ease;
        }

        .timeline_item:hover {
            background-color: #e1e4ec;
        }

        .timeline_item.active {
            background-color: #e1e4ec;
            font-weight: bold;
        }

        .timeline_time {
            width: 70px;
            flex-shrink: 0;

            font-size: 15px;
            white-space: nowrap;
        }

        .timeline_content {
            margin-left: 10px;
            font-size: 15px;

            white-space: nowrap;
        }

        .timeline_content h4 {
            margin: 0;
        }

    </style>
</head>


<body>

    <!-- =========================
         사이드바
    ========================= -->

    <div class="sidebar">

        <div class="logo">
            <img src="circle.png">
            <h2>강의 정리 AI</h2>
        </div>


        <div class="sidebar_menu">

            <!-- 홈 -->
            <div class="menu_item"
                 id="home_button">

                <img src="home.png">

                <button class="menu_btn">
                    홈
                </button>

            </div>


            <!-- 타임라인 -->
            <div class="menu_item"
                 id="timeline_button">

                <img src="timeline.png">

                <button class="menu_btn">
                    타임라인
                </button>

            </div>


            <!-- 핵심요약 -->
            <div class="menu_item">

                <img src="summary.png">

                <button class="menu_btn">
                    핵심 요약
                </button>

            </div>


            <!-- 퀴즈 -->
            <div class="menu_item">

                <img src="quiz.png">

                <button class="menu_btn">
                    퀴즈
                </button>

            </div>


            <!-- 오답노트 -->
            <div class="menu_item">

                <img src="wrong.png">

                <button class="menu_btn">
                    오답노트
                </button>

            </div>

        </div>

    </div>



    <!-- =========================
         메인
    ========================= -->

    <div class="main">


        <!-- 기본 화면 -->

        <div class="content">

            <h1>메인 화면</h1>

            <p>
                왼쪽 메뉴에서 타임라인을 클릭해보세요.
            </p>

        </div>



        <!-- =========================
             타임라인 화면
        ========================= -->

        <div class="timeline_page">

            <h1>타임라인</h1>


            <div class="timeline_layout">


                <!-- 영상 -->

                <div class="video_container">

                    <video id="video" controls>

                        <!-- 테스트용 영상 -->

                        <source
                            id="video_mp4"
                            src="test.mp4"
                            type="video/mp4">

                        브라우저가 영상을 지원하지 않습니다.

                    </video>

                </div>



                <!-- 타임라인 -->

                <div class="timeline"></div>


            </div>

        </div>

    </div>



    <script>

        /* =====================================
           테스트용 타임라인 데이터
        ===================================== */

        const timelineData = [

            {
                time: 0,
                title: "강의 소개"
            },

            {
                time: 5,
                title: "명사"
            },

            {
                time: 10,
                title: "가산명사"
            },

            {
                time: 15,
                title: "불가산 명사"
            }

        ];



        /* =====================================
           영상
        ===================================== */

        const video = document.querySelector("#video");



        /* =====================================
           초 → MM:SS
        ===================================== */

        function formatTime(seconds) {

            const minutes =
                Math.floor(seconds / 60);

            const secondsLeft =
                Math.floor(seconds % 60);

            return (
                String(minutes).padStart(2, "0")
                + ":"
                + String(secondsLeft).padStart(2, "0")
            );

        }



        /* =====================================
           타임라인
        ===================================== */

        const timeline =
            document.querySelector(".timeline");



        timelineData.forEach((item, index) => {

            const timelineItem =
                document.createElement("div");


            timelineItem.classList.add(
                "timeline_item"
            );


            timelineItem.innerHTML = `

                <div class="timeline_time">

                    ${formatTime(item.time)}

                </div>


                <div class="timeline_content">

                    <h4>
                        ${item.title}
                    </h4>

                </div>

            `;



            /* ===============================
               타임라인 클릭
            =============================== */

            timelineItem.addEventListener(
                "click",
                () => {

                    /*
                     * 해당 타임라인의
                     * 영상 시간으로 이동
                     */

                    video.currentTime =
                        item.time;


                    /*
                     * 영상 자동 재생
                     */

                    video.play();


                    /*
                     * 현재 선택된 항목 표시
                     */

                    document
                        .querySelectorAll(
                            ".timeline_item"
                        )
                        .forEach(item => {

                            item.classList.remove(
                                "active"
                            );

                        });


                    timelineItem.classList.add(
                        "active"
                    );

                }
            );


            timeline.appendChild(
                timelineItem
            );

        });



        /* =====================================
           영상 재생 중 현재 타임라인 표시
        ===================================== */

        video.addEventListener(
            "timeupdate",
            () => {

                let currentIndex = 0;


                /*
                 * 현재 영상 시간이
                 * 어느 구간에 속하는지 찾음
                 */

                for (
                    let i = 0;
                    i < timelineData.length;
                    i++
                ) {

                    if (
                        video.currentTime
                        >= timelineData[i].time
                    ) {

                        currentIndex = i;

                    } else {

                        break;

                    }

                }


                /*
                 * 모든 항목의 active 제거
                 */

                document
                    .querySelectorAll(
                        ".timeline_item"
                    )
                    .forEach(
                        item => {

                            item.classList.remove(
                                "active"
                            );

                        }
                    );


                /*
                 * 현재 항목 active
                 */

                const items =
                    document.querySelectorAll(
                        ".timeline_item"
                    );


                if (items[currentIndex]) {

                    items[currentIndex]
                        .classList.add(
                            "active"
                        );

                }

            }
        );



        /* =====================================
           타임라인 버튼
        ===================================== */

        const timelineButton =
            document.querySelector(
                "#timeline_button"
            );


        const timelinePage =
            document.querySelector(
                ".timeline_page"
            );


        const content =
            document.querySelector(
                ".content"
            );


        timelineButton.addEventListener(
            "click",
            () => {

                content.style.display =
                    "none";

                timelinePage.style.display =
                    "block";

            }
        );



        /* =====================================
           홈 버튼
        ===================================== */

        const homeButton =
            document.querySelector(
                "#home_button"
            );


        homeButton.addEventListener(
            "click",
            () => {

                timelinePage.style.display =
                    "none";

                content.style.display =
                    "block";

            }
        );

    </script>

</body>
</html>
