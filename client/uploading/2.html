<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강의정리 AI</title>
    <style>
 .progress-container {
    width: 500px;
    margin: 30px auto;
    text-align: center;
}

.progress-bar {
    width: 100%;
    height: 15px;
    background-color: #eeeeee;
    border-radius: 10px;
    overflow: hidden;
}

.progress {
    width: 0%;
    height: 100%;
    background-color: #3CAEFF;
    border-radius: 10px;
    transition: width 0.3s ease;
}
    </style>
</head>
<body>
 <div class="progress-container">
    <div class="progress-bar">
        <div id="progress" class="progress"></div>
    </div>

    <p id="progress_text">분석 준비 중... 0%</p>
</div>


</body>
</html>
